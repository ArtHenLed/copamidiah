<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=576, height=384, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Copa - Painel LED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 576px;
            height: 384px;
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Roboto', sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
        }
        .group-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #FACC15; 
            color: #000000; 
            padding: 8px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .group-title { font-size: 30px; font-weight: 900; }
        .matches-container {
            flex: 1; 
            display: flex;
            flex-direction: column;
            gap: 8px; 
        }
        .match-row-result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333333;
            padding-bottom: 5px;
            padding-top: 5px;
        }
        .match-row-future {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1A1A1A; 
            border-radius: 6px;
            padding: 10px 12px;
            margin-top: 5px;
        }
        .team {
            display: flex;
            align-items: center;
            gap: 10px; 
            width: 220px; 
        }
        .flag {
            width: 35px;
            height: 24px;
            border-radius: 3px;
            object-fit: cover;
            border: 1px solid #333;
        }
        .team-code { font-size: 28px; font-weight: bold; }
        .mid-info {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 86px; 
        }
        .score {
            font-size: 35px;
            font-weight: 900;
            color: #FACC15; 
            letter-spacing: 2px;
        }
        .date {
            font-size: 15px;
            color: #AAAAAA; 
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="group-header">
        <div class="group-title">GRUPO A</div>
        <img src="https://logodownload.org/wp-content/uploads/2018/01/copa-do-mundo-2022-logo.png" alt="Copa" style="height: 35px;">
    </div>
    <div class="matches-container" id="painel-jogos">
        
        <div class="match-row-result">
            <div class="team">
                <img src="{{BANDEIRA_CASA_1}}" class="flag">
                <div class="team-code">{{SIGLA_CASA_1}}</div>
            </div>
            <div class="mid-info"><div class="score">{{PLACAR_CASA_1}}-{{PLACAR_FORA_1}}</div></div>
            <div class="team" style="justify-content: flex-end;">
                <div class="team-code">{{SIGLA_FORA_1}}</div>
                <img src="{{BANDEIRA_FORA_1}}" class="flag">
            </div>
        </div>

        <div class="match-row-result">
            <div class="team">
                <img src="{{BANDEIRA_CASA_2}}" class="flag">
                <div class="team-code">{{SIGLA_CASA_2}}</div>
            </div>
            <div class="mid-info"><div class="score">{{PLACAR_CASA_2}}-{{PLACAR_FORA_2}}</div></div>
            <div class="team" style="justify-content: flex-end;">
                <div class="team-code">{{SIGLA_FORA_2}}</div>
                <img src="{{BANDEIRA_FORA_2}}" class="flag">
            </div>
        </div>

        <div class="match-row-future">
            <div class="team">
                <img src="{{BANDEIRA_CASA_3}}" class="flag">
                <div class="team-code">{{SIGLA_CASA_3}}</div>
            </div>
            <div class="mid-info"><div class="date">{{DATA_JOGO}}<br>{{HORA_JOGO}}</div></div>
            <div class="team" style="justify-content: flex-end;">
                <div class="team-code">{{SIGLA_FORA_3}}</div>
                <img src="{{BANDEIRA_FORA_3}}" class="flag">
            </div>
        </div>

    </div>
</body>
</html>
